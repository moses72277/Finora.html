<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finora</title><style>body{margin:0;font-family:Arial;background:#0a1931;color:#fff}.header{padding:15px;text-align:center;background:#0a1931;border-bottom:1px solid #1e3a5f}.logo{width:60px;height:60px;border-radius:15px;background:#fff}.card{background:#132a4f;padding:15px;margin:15px;border-radius:12px}button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:10px;background:#1e90ff;color:#fff;font-weight:bold;font-size:16px}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#0f2340;color:#fff}.paywall{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a1931;z-index:9999;padding:20px;overflow:auto}.plan{border:2px solid #444;border-radius:12px;padding:14px;margin:12px 0;background:#132a4f}.hidden{display:none}.stat{background:#132a4f;padding:12px;border-radius:8px;text-align:center;margin:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px}.small{width:auto;padding:6px 10px;font-size:12px}.del{background:#dc2626}.sell{background:#10b981}.wa{background:#25D366}.tab{flex:1;padding:10px;background:#132a4f;border-radius:8px;color:#fff;margin:2px}.tab.active{background:#1e90ff}</style></head><body>
<div id="authPage"><div class="header"><h2>Finora<br><small>BUSINESS MANAGEMENT</small></h2></div><div class="card"><h2>Login</h2><input id="loginEmail" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password"><button id="loginBtn">Login</button><button id="showSignup" style="background:#333">Create Account</button><p id="authMsg"></p></div></div>
<div id="signupPage" class="hidden"><div class="header"><h2>Finora</h2></div><div class="card"><input id="signupName" placeholder="Shop Name"><input id="signupEmail" placeholder="Email"><input id="signupPassword" type="password" placeholder="Password"><button id="signupBtn">Create Account</button><button id="backLogin" style="background:#333">Back</button><p id="signupMsg"></p></div></div>
<div id="paywall" class="paywall hidden"><center><h2>Choose Your Plan</h2><p id="debug"></p></center><div class="plan" style="border-color:#10b981"><h3>FREE 3 Days</h3><p>Full access</p><button id="freeBtn" style="background:#10b981">Start Free Trial</button></div><div class="plan"><h3>Ordinary N3k</h3><button onclick="payFor('ordinary')" style="background:#555">Pay N3k</button></div><div class="plan" style="border-color:#1e90ff"><h3>Premium N5k BEST</h3><p>200 Products + WhatsApp</p><button onclick="payFor('premium')">Pay N5k</button></div><div class="plan"><h3>Standard N10k</h3><button onclick="payFor('standard')" style="background:#10b981">Pay N10k</button></div><button id="logout2" style="background:#333;margin-top:20px">Logout</button></div>
<div id="dashPage" class="hidden"><div class="header"><h3>Finora Business</h3><p id="welcome"></p><p id="subStatus"></p><button id="logout" style="background:#333">Logout</button></div><div class="stats"><div class="stat">Stock<br><b id="tStock">0</b></div><div class="stat">Sales<br><b id="tCollected">N0</b></div><div class="stat">Expenses<br><b id="tExpenses">N0</b></div><div class="stat">Profit<br><b id="tProfit">N0</b></div></div><div style="display:flex"><button id="tabInv" class="tab active">Inventory</button><button id="tabSales" class="tab">Sales</button><button id="tabExp" class="tab">Expenses</button></div><div id="invSection" class="card"><h3>Add Stock</h3><p id="limitInfo"></p><input id="pName" placeholder="Product Name"><input id="pQty" type="number" placeholder="Qty"><input id="pCost" type="number" placeholder="Cost"><input id="pPrice" type="number" placeholder="Selling Price"><button id="saveProduct">Add Product</button><input id="searchStock" placeholder="Search..." style="margin-top:15px"><div id="stockList"></div></div><div id="salesSection" class="card hidden"><h3>Sales + WhatsApp</h3><div id="cList"></div></div><div id="expSection" class="card hidden"><h3>Expenses</h3><input id="eName" placeholder="Expense"><input id="eAmount" type="number" placeholder="Amount"><button id="saveExp">Save</button><div id="eList"></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,serverTimestamp,updateDoc,setDoc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBVbRIOthbZxre5BL4r-hb5BoRP_DRGOZE",authDomain:"finora-1829e.firebaseapp.com",projectId:"finora-1829e"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
let user=null,customers=[],expenses=[],products=[],userPlan={plan:null};
const PLANS={ordinary:{limit:50},premium:{limit:200},standard:{limit:999999},trial:{limit:200}};
async function directLogin(e,p){const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+cfg.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});const d=await r.json();if(!r.ok)throw new Error(d.error.message);await signInWithEmailAndPassword(auth,e,p).catch(()=>location.reload());}
async function directSignup(e,p,n){const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+cfg.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});const d=await r.json();if(!r.ok)throw new Error(d.error.message);await signInWithEmailAndPassword(auth,e,p).then(async()=>{if(n)await updateProfile(auth.currentUser,{displayName:n});await setDoc(doc(db,"users",auth.currentUser.uid),{email:e,name:n||"",plan:null,expiresAt:null,trialUsed:false,createdAt:serverTimestamp()},{merge:true});}).catch(()=>location.reload());}
showSignup.onclick=()=>{authPage.classList.add("hidden");signupPage.classList.remove("hidden");};
backLogin.onclick=()=>{signupPage.classList.add("hidden");authPage.classList.remove("hidden");};
signupBtn.onclick=async()=>{try{signupMsg.textContent="Creating...";await directSignup(signupEmail.value,signupPassword.value,signupName.value);}catch(e){signupMsg.textContent=e.message;}};
loginBtn.onclick=async()=>{try{authMsg.textContent="Logging...";await directLogin(loginEmail.value,loginPassword.value);}catch(e){authMsg.textContent=e.message;}};
tabInv.onclick=()=>{invSection.classList.remove("hidden");salesSection.classList.add("hidden");expSection.classList.add("hidden");};
tabSales.onclick=()=>{invSection.classList.add("hidden");salesSection.classList.remove("hidden");expSection.classList.add("hidden");};
tabExp.onclick=()=>{invSection.classList.add("hidden");salesSection.classList.add("hidden");expSection.classList.remove("hidden");};
onAuthStateChanged(auth,async u=>{if(u){user=u;authPage.classList.add("hidden");signupPage.classList.add("hidden");welcome.textContent="Hello "+(u.displayName||u.email);debug.textContent="User: "+u.uid.slice(0,8);await checkSub();}else{authPage.classList.remove("hidden");dashPage.classList.add("hidden");paywall.classList.add("hidden");}});
logout.onclick=()=>signOut(auth);logout2.onclick=()=>signOut(auth);
async function checkSub(){try{const snap=await getDoc(doc(db,"users",user.uid));if(!snap.exists()){paywall.classList.remove("hidden");dashPage.classList.add("hidden");return;}const data=snap.data();userPlan=data;debug.textContent+=" | Plan: "+(data.plan||"none");if(!data.plan||!data.expiresAt){paywall.classList.remove("hidden");dashPage.classList.add("hidden");return;}const exp=new Date(data.expiresAt),now=new Date();if(now>exp){paywall.classList.remove("hidden");dashPage.classList.add("hidden");return;}paywall.classList.add("hidden");dashPage.classList.remove("hidden");const days=Math.ceil((exp-now)/86400000);subStatus.textContent=(data.plan||"").toUpperCase()+" - "+days+" days left";await loadAll();}catch(e){debug.textContent="Error: "+e.message;paywall.classList.remove("hidden");}}
document.getElementById("freeBtn").onclick=async()=>{try{debug.textContent="Starting trial...";const exp=new Date();exp.setDate(exp.getDate()+3);await setDoc(doc(db,"users",user.uid),{plan:"trial",expiresAt:exp.toISOString(),trialUsed:true},{merge:true});paywall.classList.add("hidden");await checkSub();}catch(e){alert("Error: "+e.message);debug.textContent=e.message;}};
window.payFor=async(plan)=>{try{const exp=new Date();exp.setDate(exp.getDate()+30);await setDoc(doc(db,"users",user.uid),{plan:plan,expiresAt:exp.toISOString()},{merge:true});paywall.classList.add("hidden");await checkSub();}catch(e){alert(e.message);}};
async function loadAll(){await loadProducts();await loadCustomers();await loadExpenses();update();}
saveProduct.onclick=async()=>{const lim=PLANS[userPlan.plan]?.limit||50;if(products.length>=lim)return alert("Limit "+lim);if(!pName.value||!pQty.value)return alert("Fill product & qty");await addDoc(collection(db,"users",user.uid,"products"),{name:pName.value,qty:Number(pQty.value),cost:Number(pCost.value)||0,price:Number(pPrice.value)||0,createdAt:serverTimestamp()});pName.value="";pQty.value="";pCost.value="";pPrice.value="";await loadProducts();update();};
saveExp.onclick=async()=>{await addDoc(collection(db,"users",user.uid,"expenses"),{name:eName.value,amount:Number(eAmount.value),createdAt:serverTimestamp()});eName.value="";eAmount.value="";await loadExpenses();update();};
async function loadProducts(){const s=await getDocs(collection(db,"users",user.uid,"products"));products=[];s.forEach(d=>products.push({id:d.id,...d.data()}));showProducts();}
function showProducts(){const q=searchStock.value.toLowerCase();const f=products.filter(p=>(p.name||"").toLowerCase().includes(q));stockList.innerHTML=f.length?f.map(p=>{const low=Number(p.qty)<=5;return "<div style='padding:10px 0;border-bottom:1px solid #333;"+(low?"background:#dc262633;padding:10px;border-radius:8px":"")+"'><b>"+p.name+" "+(low?"🔴 LOW":"")+"</b><br>Qty:"+p.qty+" | N"+p.price+"<br><button class='small sell' onclick=\"sellP('"+p.id+"')\">Sell</button> <button class='small del' onclick=\"delP('"+p.id+"')\">Del</button></div>"}).join(""):"No stock";tStock.textContent=products.reduce((a,b)=>a+Number(b.qty||0),0);limitInfo.textContent=userPlan.plan+" - "+products.length+"/"+PLANS[userPlan.plan].limit;}
searchStock.oninput=showProducts;
async function loadCustomers(){const s=await getDocs(collection(db,"users",user.uid,"customers"));customers=[];s.forEach(d=>customers.push({id:d.id,...d.data()}));showCustomers();}
async function loadExpenses(){const s=await getDocs(collection(db,"users",user.uid,"expenses"));expenses=[];s.forEach(d=>expenses.push({id:d.id,...d.data()}));showExpenses();}
function showCustomers(){cList.innerHTML=customers.map(c=>"<div style='padding:10px 0;border-bottom:1px solid #333'><b>"+c.name+"</b><br>"+c.product+" x"+c.qty+"=N"+c.amount+"<br><button class='small wa' onclick=\"sendWA('"+c.id+"')\">WhatsApp</button> <button class='small del' onclick=\"delC('"+c.id+"')\">Del</button></div>").join("")||"No sales";}
function showExpenses(){eList.innerHTML=expenses.map(e=>"<div>"+e.name+" - N"+e.amount+" <button class='small del' onclick=\"delE('"+e.id+"')\">X</button></div>").join("");}
function update(){const inc=customers.reduce((t,i)=>t+Number(i.amount||0),0),exp=expenses.reduce((t,i)=>t+Number(i.amount||0),0);tCollected.textContent="N"+inc.toLocaleString();tExpenses.textContent="N"+exp.toLocaleString();tProfit.textContent="N"+(inc-exp).toLocaleString();}
window.sellP=async id=>{const p=products.find(x=>x.id===id);const qty=Number(prompt("How many "+p.name+"? Max "+p.qty));if(!qty||qty>p.qty)return alert("Invalid");const cust=prompt("Customer Name?")||"Customer";const phone=prompt("WhatsApp?")||"";const total=qty*Number(p.price);await updateDoc(doc(db,"users",user.uid,"products",id),{qty:Number(p.qty)-qty});await addDoc(collection(db,"users",user.uid,"customers"),{name:cust,product:p.name,qty:qty,amount:total,phone:phone,createdAt:serverTimestamp()});await loadProducts();await loadCustomers();update();if(phone){const text="Receipt from "+(user.displayName||"Shop")+" - "+p.name+" x"+qty+" = N"+total;const num=phone.replace(/\D/g,"");const waNum=num.startsWith("0")?"234"+num.slice(1):num;window.open("https://wa.me/"+waNum+"?text="+encodeURIComponent(text),"_blank");}};
window.sendWA=async cid=>{const c=customers.find(x=>x.id===cid);const text="Receipt: "+c.product+" x"+c.qty+" = N"+c.amount;if(c.phone){const num=c.phone.replace(/\D/g,"");const waNum=num.startsWith("0")?"234"+num.slice(1):num;window.open("https://wa.me/"+waNum+"?text="+encodeURIComponent(text),"_blank");}else window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");};
window.delP=async id=>{await deleteDoc(doc(db,"users",user.uid,"products",id));await loadProducts();update();};
window.delC=async id=>{await deleteDoc(doc(db,"users",user.uid,"customers",id));await loadCustomers();update();};
window.delE=async id=>{await deleteDoc(doc(db,"users",user.uid,"expenses",id));await loadExpenses();update();};
</script></body></html>
