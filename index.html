<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finora</title>
<style>
body{margin:0;font-family:Arial;background:#0a1931;color:#fff}
.header{padding:15px;text-align:center;background:#0a1931;border-bottom:1px solid #1e3a5f}
.card{background:#132a4f;padding:15px;margin:15px;border-radius:12px}
button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:10px;background:#1e90ff;color:#fff;font-weight:bold;font-size:16px}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#0f2340;color:#fff}
.paywall{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a1931;z-index:99;padding:15px;overflow:auto}
.plan{border:2px solid #444;border-radius:12px;padding:14px;margin:12px 0;background:#132a4f}
.hidden{display:none}
</style>
</head>
<body>

<div id="authPage">
<div class="header"><h2>Finora<br><small>BUSINESS MANAGEMENT</small></h2></div>
<div class="card"><h2>Login</h2><input id="loginEmail" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password"><button id="loginBtn">Login</button><button id="showSignup" style="background:#333">Create Account</button><p id="authMsg"></p></div>
</div>

<div id="signupPage" class="hidden">
<div class="header"><h2>Finora</h2></div>
<div class="card"><input id="signupName" placeholder="Shop Name"><input id="signupEmail" placeholder="Email"><input id="signupPassword" type="password" placeholder="Password"><button id="signupBtn">Create Account</button><button id="backLogin" style="background:#333">Back</button><p id="signupMsg"></p></div>
</div>

<div id="paywall" class="paywall hidden">
<center><h2>Choose Your Plan</h2></center>
<div id="freePlanDiv" class="plan" style="border-color:#10b981"><h3>🎁 FREE 3 Days</h3><button onclick="startFreeTrial()" style="background:#10b981">Start Free Trial</button></div>
<div class="plan"><h3>Ordinary ₦3k</h3><p>50 Products</p><button onclick="payFor('ordinary')" style="background:#555">Pay ₦3k</button></div>
<div class="plan" style="border-color:#1e90ff"><h3>⭐ Premium ₦5k</h3><p>200 + WhatsApp</p><button onclick="payFor('premium')">Pay ₦5k</button></div>
<div class="plan"><h3>Standard ₦10k</h3><p>Unlimited</p><button onclick="payFor('standard')" style="background:#10b981">Pay ₦10k</button></div>
<button id="logout2" style="background:#333;margin-top:20px">Logout</button>
</div>

<div id="dashPage" class="hidden">
<div class="header"><h3>Finora Business</h3><p id="welcome"></p><p id="subStatus"></p><button id="logout" style="background:#333">Logout</button></div>
<div class="card"><h2 style="text-align:center">🎉 Welcome! Your shop is active</h2><p style="text-align:center">Your Finora app is working now</p></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBVbRIOthbZxre5BL4r-hb5BoRP_DRGOZE",authDomain:"finora-1829e.firebaseapp.com",projectId:"finora-1829e"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
async function directLogin(e,p){const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${cfg.apiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});const d=await r.json();if(!r.ok)throw new Error(d.error.message);await signInWithEmailAndPassword(auth,e,p).catch(()=>location.reload());}
async function directSignup(e,p,n){const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${cfg.apiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});const d=await r.json();if(!r.ok)throw new Error(d.error.message);await signInWithEmailAndPassword(auth,e,p).then(async()=>{if(n)await updateProfile(auth.currentUser,{displayName:n});await setDoc(doc(db,"users",auth.currentUser.uid),{email:e,name:n||"",plan:null,expiresAt:null,trialUsed:false,createdAt:serverTimestamp()},{merge:true});}).catch(()=>location.reload());}
showSignup.onclick=()=>{authPage.classList.add("hidden");signupPage.classList.remove("hidden");};
backLogin.onclick=()=>{signupPage.classList.add("hidden");authPage.classList.remove("hidden");};
signupBtn.onclick=async()=>{try{signupMsg.textContent="Creating...";await directSignup(signupEmail.value,signupPassword.value,signupName.value);}catch(e){signupMsg.textContent=e.message;}};
loginBtn.onclick=async()=>{try{authMsg.textContent="Logging...";await directLogin(loginEmail.value,loginPassword.value);}catch(e){authMsg.textContent=e.message;}};
onAuthStateChanged(auth,async u=>{if(u){authPage.classList.add("hidden");signupPage.classList.add("hidden");welcome.textContent="Hello "+(u.displayName||u.email);await checkSub();}else{authPage.classList.remove("hidden");dashPage.classList.add("hidden");paywall.classList.add("hidden");}});
logout.onclick=()=>signOut(auth);logout2.onclick=()=>signOut(auth);
async function checkSub(){const snap=await getDoc(doc(db,"users",auth.currentUser.uid));if(!snap.exists()){paywall.classList.remove("hidden");return;}const d=snap.data();if(!d.plan||!d.expiresAt){paywall.classList.remove("hidden");dashPage.classList.add("hidden");if(d.trialUsed)freePlanDiv.style.display="none";return;}const exp=new Date(d.expiresAt),now=new Date();if(now>exp){paywall.classList.remove("hidden");dashPage.classList.add("hidden");freePlanDiv.style.display="none";return;}paywall.classList.add("hidden");dashPage.classList.remove("hidden");const days=Math.ceil((exp-now)/86400000);subStatus.textContent=d.plan==="trial"?`FREE TRIAL - ${days} days left`:`${d.plan.toUpperCase()} - ${days} days left`;}
window.startFreeTrial=async()=>{const snap=await getDoc(doc(db,"users",auth.currentUser.uid));if(snap.exists()&&snap.data().trialUsed)return alert("Already used");const exp=new Date();exp.setDate(exp.getDate()+3);await setDoc(doc(db,"users",auth.currentUser.uid),{plan:"trial",expiresAt:exp.toISOString(),trialUsed:true},{merge:true});paywall.classList.add("hidden");await checkSub();};
window.payFor=async(p)=>{const exp=new Date();exp.setDate(exp.getDate()+30);await setDoc(doc(db,"users",auth.currentUser.uid),{plan:p,expiresAt:exp.toISOString()},{merge:true});paywall.classList.add("hidden");await checkSub();};
</script>
</body>
</html>
